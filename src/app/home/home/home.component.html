<div id="fullBg">
  <!-- Navbar -->
  <div id="imgBackground">
    <div class="header">
      <header id="logo">
        <div id="classLogo"></div>
        <mat-toolbar class="navBar">
          <img id="logonav" src="img/hairhub.png" alt="Logo" routerLink="/home">
          
          <span class="example-spacer"></span>

          <!-- Navbar condizionale: se siamo sulla home mostriamo l'icona login e il menu -->
          <ng-container *ngIf="isHomePage; else otherPagesNavbar">
            <!-- Icone di login e menu per la home -->
            <button id="btnLogin" mat-button [matMenuTriggerFor]="login">
              <img id="nav2" src="img/login.png" alt="Login Icon" style="width: 24px; height: 24px; background-color: black;">
            </button>
            <button id="btn" mat-button [matMenuTriggerFor]="menu">Menu</button>
            <mat-menu #menu="matMenu">
              <button routerLink="/home" mat-menu-item>Home</button>
              <button mat-menu-item>Servizi</button>
              <button mat-menu-item>Contatti</button>
              <button *ngIf="isAuthenticated" mat-button (click)="openSidenav()">Miei appuntamenti</button>
            </mat-menu>
            <mat-menu #login="matMenu">
              <button *ngIf="!isAuthenticated" (click)="openLoginDialog()" mat-menu-item>Accedi</button>
              <button *ngIf="!isAuthenticated" (click)="openRegisterDialog()" mat-menu-item>Registrati</button>
              <button *ngIf="isAuthenticated" mat-button (click)="logout()">Logout</button>
            </mat-menu>
          </ng-container>

          <!-- Navbar per le altre pagine: solo icona per tornare alla home -->
          <ng-template #otherPagesNavbar>
            <button mat-button routerLink="/home">
              <img id="homeIcon" src="img/home.png" alt="Home Icon" style="width: 24px; height: 24px;">
            </button>
          </ng-template>
        </mat-toolbar>
      </header>
    </div>
  </div>

  <div class="content">
    <!-- Contenuti principali -->
    <app-topsaloon></app-topsaloon>
    <div id="carousel">
      <app-swiper-carousel></app-swiper-carousel>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <ul class="social_icon">
      <li><img id="facebook" src="img/facebook.png" alt="Facebook"></li>
      <li><img src="img/twitter.png" alt="Twitter"></li>
      <li><img src="img/instagram.png" alt="Instagram"></li>
    </ul>
    <ul class="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <p>©2024 Chris Tobojia | All Rights Reserved</p>
  </footer>
</div>
